    | CLI framework   | spf13/cobra | Command routing: `auth`, `join`, `schedule` |

    | Scheduler       | robfig/cron/v3 | Cron-based daemon mode |

    | Audio encoding  | braheezy/shine-mp3 | Pure-Go MP3 encoder |

    | Assertions      | stretchr/testify | Unit and integration test assertions |'
  AGENTIC_CONFIG_GLOB: .github/**`, `.copilot/config.json`, `.copilot/settings.json`, `.copilot/installed-plugins/**`, `.mcp.json`, `AGENTS.md
  ALT_DOC_REVIEW_FAMILY: ''
  ALT_DOC_REVIEW_PROVIDER: ''
  ALT_REVIEW_FAMILY: ''
  ALT_REVIEW_PROVIDER: ''
  ANTI_PATTERNS: '* Bare `panic()` in library code — reserve for truly unrecoverable states in `main()` initialization only

    * `any` without justification — use a specific type or generic constraint when one suffices

    * Global mutable state — pass dependencies explicitly through function parameters or struct fields

    * `fmt.Println` for logging — use `log/slog`

    * `os.Exit` outside `main()` — return errors to callers

    * Discarded errors without a justifying comment

    * `init()` for complex logic — use explicit initialization called from `main()`

    * Naked goroutines without cancellation or lifecycle management'
  AUTOHARNESS_VERSION: 1.5.0
  BACKLOG_DIRECTORY: .backlogit
  BACKLOG_TOOL_NAME: backlogit
  BUILD_CHECK_COMMAND: go vet ./...
  BUILD_COMMAND: go build ./...
  BUILD_TOOL: go
  CI_DEFAULT_BRANCH: main
  CI_NOTES: GitHub Actions runs go build, go vet (including -tags=integration), golangci-lint, and go test -race with coverage. Formatting is NOT checked in CI — gofmt is enforced only by the local pre-push gate. Release and CLI-reference-drift workflows run separately.
  CI_PLATFORM: GitHub Actions
  CI_WORKFLOW_GLOB: '**/.github/workflows/*.yml'
  COMMIT_SCOPES: cli, browser, auth, transcript, audio, scheduler, config
  CONCURRENCY_PATTERNS: goroutines, `sync.WaitGroup`, `sync.Mutex`/`RWMutex`, channels, `context.Context` cancellation, `errgroup`, `select` loops, `atomic` operations
  COPILOT_EXE_PATH: copilot
  DATE: '2026-09-04'
  DEFAULT_BRANCH: main
  DOCS_ROOT: docs
  DOCS_SECURITY: docs/security
  DOCUMENTATION_CONVENTIONS: Godoc comments on every exported type, function, and package, starting with the identifier name.
  DOC_COMMENT_STYLE: // Identifier ... godoc comment
  ERROR_HANDLING_CONVENTIONS: 'Errors are returned, never panicked, from library code. Wrap with context using `fmt.Errorf("...: %w", err)`. Sentinel errors use `errors.Is`/`errors.As` comparisons.'
  ERROR_HANDLING_POLICY: Every returned error MUST be checked or explicitly discarded with `_ =` plus a comment explaining why.
  ERROR_PATTERN: 'explicit `if err != nil` with `fmt.Errorf("...: %w", err)` wrapping'
  EXAMPLE_SCOPE: cli
  FILE_EXT: go
  FORMATTER: gofmt
  FORMAT_CHECK_COMMAND: gofmt -l .
  FORMAT_COMMAND: gofmt -l .
  FORMAT_FIX_COMMAND: gofmt -w .
  FORMAT_TOOL: gofmt
  GRAPHTOR_EMBED_MODEL_DIR: C:\Source\GitHub\go-teams\.graphtor\models\all-MiniLM-L6-v2
  GRAPHTOR_ENV_BLOCK: '

    # graphtor-docs: local sentence-transformer model directory used for

    # offline vector search. Update if you relocate the model.

    GRAPHTOR_EMBED_MODEL_DIR=C:\Source\GitHub\go-teams\.graphtor\models\all-MiniLM-L6-v2'
  HARNESS_ENFORCED_SUMMARY: '* Linting and static analysis — `golangci-lint run` and `go vet ./...` (including `-tags=integration`) are hard CI gates; `gofmt` formatting is enforced by the local pre-push gate only, so still report formatting problems that cause real defects.

    * Commit, branch, and merge hygiene — conventional-commit scopes, merge-commit-only (P-009), and PR readiness are enforced by `commit-message`, `git-merge`, `pull-request`, and `github-pr-automation` instructions.

    * Test-first red-green gates — P-002 and P-004 plus the `harness-architect` skill require a compiling-but-failing harness before implementation, verified in CI by `go test -race ./...`.

    * Backlog bookkeeping — work-item IDs, status transitions, and traceability are managed through the backlogit registry at `.autoharness/backlog-registry.yaml`.

    * Role-boundary compliance — the two-agent Stage/Ship model and `role-enforcement.instructions.md` gate which agent may mutate which artifact class.'
  HARNESS_MANIFEST_PATH: .autoharness/harness-manifest.yaml
  LANGUAGE_ERROR_HANDLING_CHECKS: '* Every returned error is checked or explicitly discarded with `_ =` and a comment

    * Errors wrapped with `fmt.Errorf("...: %w", err)` to preserve the chain

    * Sentinel errors compared with `errors.Is`, not `==`

    * No swallowed errors in defer/cleanup paths without logging'
  LANGUAGE_FILE_GLOB: '**/*.go'
  LANGUAGE_IDIOM_CHECKS: '* Use short, descriptive variable names scoped to their lifetime; avoid Hungarian notation

    * Return early on error conditions instead of nesting the happy path

    * Accept interfaces, return concrete types

    * Use composition over embedding-heavy inheritance-style hierarchies

    * Prefer explicit interface satisfaction with a compile-time assertion (`var _ Interface = (*Type)(nil)`) when the contract matters'
  LANGUAGE_NOTES: (Go 1.26; standard library first, minimal third-party dependencies)
  LANGUAGE_PERFORMANCE_CHECKS: '* Avoid unnecessary allocations in hot paths (loops, DOM/CDP polling, audio encoding)

    * Reuse buffers where profiling shows allocation pressure

    * Avoid excessive interface boxing for values passed at high frequency

    * Prefer streaming/incremental processing for audio and DOM mutation observation over buffering entire streams in memory'
  LANGUAGE_SAFETY_CHECKS: '* No `unsafe` package usage without documented justification

    * No unchecked type assertions (`x.(T)` without the `, ok` form) outside test code

    * No goroutine leaks — every goroutine has a cancellation path via `context.Context`

    * No data races — shared state protected by sync primitives or channels

    * No panics in library code — only in `main()` for truly unrecoverable states'
  LANGUAGE_VERSION: '1.26'
  LANGUAGE_VERSION_DETAIL: Go 1.26 (module github.com/softwaresalt/go-teams)
  LINTER: golangci-lint
  LINT_COMMAND: golangci-lint run
  LINT_POLICY: '`golangci-lint run` MUST pass with zero issues; all findings are hard errors.'
  LINT_TOOL: golangci-lint
  MAX_WAIT: '600'
  NAMING_CONVENTIONS: PascalCase (MixedCaps) for exported identifiers, camelCase for unexported identifiers; package names are short, lowercase, and free of underscores.
  POLL_INTERVAL: '30'
  PRIMARY_LANGUAGE: Go
  PRIMARY_LANGUAGE_LOWER: go
  PROJECT_DESCRIPTION: standalone Go CLI for autonomous Microsoft Teams live-transcription and audio capture via headless browser automation (chromedp)
  PROJECT_NAME: go-teams
  PROJECT_STRUCTURE: 'go-teams/

    ├── cmd/

    │   └── teams-cli/       # main package (Cobra root command)

    ├── internal/

    │   ├── audio/           # pure-Go MP3 encoding, audio capture

    │   ├── browser/         # chromedp allocation, stealth flags, FSM

    │   ├── capture/         # capture orchestration

    │   ├── cli/             # command wiring and flag parsing

    │   ├── config/          # configuration loading and validation

    │   ├── scheduler/       # cron-based daemon mode

    │   ├── teams/           # Teams meeting join and auth flows

    │   └── transcript/      # DOM caption interception, dedup, Markdown writer

    ├── docs/                # durable knowledge (design-docs, product-specs, plans, ...)

    ├── scripts/             # harness helper scripts

    ├── .backlogit/          # backlog workflow state

    ├── .github/             # agent harness

    └── go.mod'
  QUALITY_GATE_1: go vet ./...
  QUALITY_GATE_1_NAME: check
  QUALITY_GATE_2: golangci-lint run
  QUALITY_GATE_2_NAME: lint
  QUALITY_GATE_3: test -z "$(gofmt -l .)"
  QUALITY_GATE_3_NAME: fmt
  QUALITY_GATE_4: go test ./...
  QUALITY_GATE_4_NAME: test
  REPOSITORY_OPERATING_MODEL: go-teams is a single standalone Go CLI binary (Cobra command routing) that drives a headless Chromium browser via chromedp to join Microsoft Teams meetings, capture live captions and audio, and persist transcripts and recordings locally. Work flows through the Stage -> Ship release-unit pipeline with backlogit-managed work items.
  REPO_NAME: go-teams
  REPO_OWNER: softwaresalt
  SECURITY_CONFIG_RULES: GitHub Copilot CLI agentic config rules for a Go workspace (permissive tool allow-lists in .copilot/settings.json, unvalidated instruction inputs under .github/, untrusted MCP servers in .mcp.json, hardcoded credentials, exposed env defaults in .env.local, missing CI security gates)
  SECURITY_OWASP_PATTERNS: 'Go OWASP patterns: fmt.Sprintf interpolation into SQL or shell strings; exec.Command and exec.CommandContext with user-controlled arguments; text/template rendering of untrusted values; encoding/gob and gopkg.in/yaml.v3 decoding of untrusted input; os.WriteFile and os.MkdirAll outside the workspace root; unvalidated filepath.Join path traversal; and chromedp.Evaluate with interpolated page data'
  SECURITY_REVIEW_PATTERNS: 'internal/cli/auth.go, internal/cli/root.go, internal/teams/**, internal/browser/**, internal/config/**, **/session*.go, **/token*.go; content keywords: login, token, password, credential, session, cookie, secret, key, UserDataDir, permission, role, exec.Command'
  SECURITY_SCAN_PATTERNS: 'Go injection, auth, and exposure patterns: exec.Command argument construction; chromedp.Evaluate and chromedp.ActionFunc script interpolation; credential and cookie handling in internal/cli/auth.go, internal/teams, and internal/browser; UserDataDir session-persistence writes in internal/browser/allocator.go; log/slog calls that could emit tokens or transcript PII; and filepath.Join path-traversal boundaries'
  SOURCE_DIR: internal/
  SOURCE_GLOB: '**/*.go'
  TEST_COMMAND: go test ./...
  TEST_DIR: co-located *_test.go files
  TEST_RUNNER: go test
  TEST_STRUCTURE: Unit tests co-located as `*_test.go` beside implementation files; integration tests gated behind the `integration` build tag.
  TEST_TIER_DESCRIPTION: 'Unit: `go test ./...` with table-driven tests co-located as `*_test.go`; Integration: `go test -tags=integration ./...` gated behind the `integration` build tag (Teams meeting join, chromedp session flows).'
  TEST_TOOL: go
