name: CLI Reference Drift Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect CLI-affecting changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # See the matching note in ci.yml: paths-filter needs github.event.before
          # present locally on push events, otherwise it attempts an authenticated
          # `git fetch` that fails under persist-credentials: false (exit 128).
          fetch-depth: 0
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            cli:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'go.work.sum'
              - 'cmd/gen-docs/**'
              - 'docs/cli-reference/**'
              - '.github/workflows/cli-reference-drift.yml'

  # DISABLED: requires go.mod and a cmd/gen-docs generator that don't exist yet
