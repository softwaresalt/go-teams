name: CI

on:
  # No paths-ignore: the lightweight `changes` job must run (and report a status
  # check) on every push and pull request, including docs/backlog-only changes,
  # so the tracked-file secret-hygiene scan is never skipped. The expensive
  # `test` job stays self-gated on the `code` filter output below.
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # On push events dorny/paths-filter diffs github.event.before against
          # the new SHA. With the default shallow fetch that commit is absent, so
          # the action falls back to `git fetch <sha>` — which cannot authenticate
          # under persist-credentials: false and aborts the job (exit 128,
          # "could not read Username"). Full history makes the base commit
          # present locally so no authenticated fetch is needed, keeping the
          # credential hardening intact. Pull-request events are unaffected
          # (the action resolves the base through the API there).
          fetch-depth: 0
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          # 'every' requires ALL patterns to match per file, so the '!' negations
          # actually exclude docs/markdown/backlog. Under the default 'some', the
          # leading '**' alone would mark every file as matched and the negations
          # would never take effect (see dorny/paths-filter README).
          predicate-quantifier: 'every'
          filters: |
            # Denylist: match any changed file that is NOT pure docs/markdown/
            # backlog state, so a code/config change can never silently skip the
            # security-sensitive lint/vet/test gate (evaluated with 'every' above).
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!.backlogit/**'
              - '!.autoharness/**'
      - name: Secret hygiene check (tracked files)
        # Runs unconditionally (never gated on steps.filter.outputs.code) so
        # docs/backlog-only changes are still scanned. Scans every git-tracked
        # file for tracked local .env files and credential values. Findings
        # print the rule and path only, never the matched secret. Mirrors the
        # rules in internal/config/gitignore_test.go.
        run: |
          python3 - <<'PY'
          import os
          import re
          import stat
          import subprocess
          import sys

          MAX_BYTES = 8 << 20
          # Live Teams meeting passcode query token (p=...) on a Teams URL.
          # Matching is done in linear time on purpose: candidate URLs are
          # extracted once and then inspected, with no nested lazy quantifiers
          # that could backtrack quadratically on a crafted tracked file.
          url = re.compile(rb"https?://[^\s\"'<>]+", re.IGNORECASE)
          passcode_query = re.compile(rb"[?&]p=([A-Za-z0-9_-]{8,})", re.IGNORECASE)
          teams_markers = (
              b"teams.microsoft.com", b"teams.live.com",
              b"teams.cloud.microsoft", b"/meet/",
          )
          skype = re.compile(rb"SKYPE-TOKEN[\"'\s:=]+eyJ[A-Za-z0-9_-]{10,}")
          bearer = re.compile(rb"Bearer\s+eyJ[A-Za-z0-9_-]{10,}")
          # Must stay identical to syntheticPasscodeMarkers in
          # internal/config/gitignore_test.go.
          synthetic = (
              b"synthetic", b"secret", b"example", b"fake", b"dummy",
              b"placeholder", b"redacted", b"sample", b"test", b"token",
              b"passcode", b"notreal", b"changeme", b"xxxx",
          )

          def has_live_passcode(data):
              for candidate in url.finditer(data):
                  text = candidate.group(0)
                  lowered = text.lower()
                  # Earliest point at which a Teams marker is complete; a
                  # passcode counts only when its p= follows that point.
                  ends = [
                      idx + len(marker)
                      for marker in teams_markers
                      for idx in (lowered.find(marker),)
                      if idx >= 0
                  ]
                  if not ends:
                      continue
                  marker_end = min(ends)
                  for query in passcode_query.finditer(text):
                      if query.start() < marker_end:
                          continue
                      value = query.group(1).lower()
                      if not any(m in value for m in synthetic):
                          return True
              return False

          def is_local_env(path):
              base = path.rsplit("/", 1)[-1]
              if base == ".env.example":
                  return False
              return base == ".env" or base.startswith(".env.") or base.endswith(".env")

          listing = subprocess.run(
              ["git", "ls-files", "-z"], check=True, capture_output=True
          ).stdout
          paths = [p.decode("utf-8", "surrogateescape") for p in listing.split(b"\0") if p]
          if not paths:
              sys.exit("secret hygiene: git ls-files returned no tracked files")

          findings = []
          for path in paths:
              if is_local_env(path):
                  findings.append((path, "tracked local environment file"))
                  continue
              try:
                  info = os.lstat(path)
              except FileNotFoundError:
                  continue  # tracked but absent from the working tree
              if not stat.S_ISREG(info.st_mode) or info.st_size > MAX_BYTES:
                  continue  # symlink, submodule, directory, or oversized
              with open(path, "rb") as handle:
                  data = handle.read(MAX_BYTES + 1)
              if b"\0" in data[:8000]:
                  continue  # binary
              if has_live_passcode(data):
                  findings.append((path, "live Teams meeting passcode URL"))
              if skype.search(data):
                  findings.append((path, "SKYPE-TOKEN credential value"))
              if bearer.search(data):
                  findings.append((path, "bearer JWT credential value"))

          for path, rule in findings:
              # repr() neutralizes control characters so a crafted path cannot
              # inject workflow commands into the log.
              print(f"ERROR: tracked file {path!r} contains a {rule}")
          if findings:
              sys.exit(1)
          print(f"secret hygiene: scanned {len(paths)} tracked files, no findings")
          PY

  test:
    name: Build, vet, lint & test
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: go mod download
      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
        run: go build -o bin/teams-cli.exe ./cmd/teams-cli
      - name: Vet
        run: go vet ./...
      - name: Vet (integration harness)
        run: go vet -tags=integration ./...
      - name: Lint
        uses: golangci/golangci-lint-action@2226d7cb06a077cd73e56eedd38eecad18e5d837 # v6.5.0
        with:
          version: v1.64.8
          install-mode: goinstall
          args: --timeout=5m
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Coverage report
        run: go tool cover -func=coverage.out

