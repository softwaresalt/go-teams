      - item: "strict-safety"
        because: "Planned auth and session-persistence flows (Teams login, MFA, on-disk tokens) are security-sensitive."
        signals: ["architecture doc UserDataDir session persistence", "planned interactive MFA login"]
      - item: "release-observability"
