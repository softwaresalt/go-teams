# .autoharness/workspace-profile.yaml
schema_version: "1.0.0"
generated_at: "2026-09-03T00:00:00Z"
workspace_path: "C:\\Source\\GitHub\\go-teams"

languages:
  primary: "Go"
  version: "1.26"
  secondary: []
  # Confirmed from go.mod (module github.com/softwaresalt/go-teams, go 1.26)
  # and 40 *.go files across cmd/ and internal/.

frameworks:
  list:
    - "chromedp"
    - "cobra"
    - "robfig/cron/v3"
    - "testify"
    - "shine-mp3"
  mcp_sdk: null
  mcp_transport: null

primary_stack_pack: "cli-tool"
stack_packs: ["cli-tool"]

build:
  tool: "go"
  command: "go build ./..."
  check_command: "go vet ./..."

test:
  runner: "go test"
  command: "go test ./..."
  directory: "co-located *_test.go files (Go convention)"
  integration_command: "go test -tags=integration ./..."

lint:
  tool: "golangci-lint"
  command: "golangci-lint run"
  config: ".golangci.yml"

format:
  tool: "gofmt"
  command: "gofmt -l ."
  fix_command: "gofmt -w ."

ci:
  platform: "GitHub Actions"
  # Hand-maintained workflows already exist: .github/workflows/ci.yml,
  # cli-reference-drift.yml, release.yml. This merge install preserves them and
  # does NOT generate the autoharness ci.yml template over the existing pipeline.
  pipeline_steps:
    - "go vet ./..."
    - "golangci-lint run"
    - "gofmt -l ."
    - "go test ./..."
  quality_gates:
    - "go vet ./..."
    - "golangci-lint run"
    - "gofmt -l ."
    - "go test ./..."
  required_check_name: "ci gate"
  linux_only: true
  path_filter_mode: "fail_closed_changes_job"
  docs_only_paths:
    - "docs/**"
    - ".backlogit/**"
    - ".autoharness/**"
  autoharness_install_command: "pip install autoharness"

local_gating:
  pre_push_enabled: true
  pre_push_gates: ["format", "lint", "test", "build"]

repo:
  owner: "softwaresalt"
  name: "go-teams"

structure:
  source_layout: "cmd/teams-cli/, internal/{audio,browser,capture,cli,config,scheduler,teams,transcript}/"
  test_layout: "co-located *_test.go files"
  doc_layout: "docs/design-docs/, docs/product-specs/"

runtime_surfaces:
  cli: true
  web_ui: false
  public_api: false
  background_jobs: true   # scheduled/daemon "schedule" mode (internal/scheduler)
  browser_tooling: ["chromedp"]
  deployment_manifests: []

runtime_validation:
  validator_manifest:
    surfaces:
      - surface: "cli"
        adapter_hint: "command"
        probe_hints:
          - id: "cli-help"
            kind: "command"
            target: "teams-cli root command"
            command: "go run ./cmd/teams-cli --help"
            expected_signal: "usage text lists auth, join, and schedule subcommands"
            required: true
            evidence_types: ["stdout", "exit-code"]
            notes: "cmd/teams-cli is scaffolded; this probe is executable today."
          - id: "cli-build"
            kind: "command"
            target: "module build"
            command: "go build ./..."
            expected_signal: "exit code 0"
            required: true
            evidence_types: ["exit-code", "stdout"]
        manual_checkpoints:
          - id: "teams-auth-mfa"
            label: "Microsoft Teams interactive login and MFA"
            reason: "Teams authentication cannot be automated; a human must complete login/MFA so the UserDataDir session is persisted."
            required_for_release: true
            evidence_types: ["operator-note", "screenshot"]
            fallback: "Record BLOCKED runtime evidence when no operator is available to complete the auth flow."
      - surface: "background-job"
        adapter_hint: "job"
        probe_hints:
          - id: "scheduler-dry-run"
            kind: "job-trigger"
            target: "teams-cli schedule daemon"
            command: "go run ./cmd/teams-cli schedule --dry-run"
            expected_signal: "cron entries parsed and next fire times reported without starting a browser"
            required: false
            evidence_types: ["stdout", "exit-code", "log-line"]
            notes: "Covers the cron daemon surface described in the architecture doc."
          - id: "scheduler-liveness-log"
            kind: "log-check"
            target: "scheduler process log"
            expected_signal: "daemon startup line followed by a scheduled-fire line"
            required: false
            evidence_types: ["log-line", "artifact-link"]
        manual_checkpoints:
          - id: "scheduled-meeting-join"
            label: "End-to-end scheduled meeting join"
            reason: "A real Teams meeting must exist and be joined on schedule to validate the daemon path."
            required_for_release: false
            evidence_types: ["operator-note", "screen-recording"]
            fallback: "Defer to a post-deploy observation window when no meeting is available."
  validation_expectations:
    required: true
    surfaces_expected: ["cli", "background-job"]
    minimum_verdict: "PASS_WITH_FOLLOW_UP"
    preserve_invariants:
      - "Persisted UserDataDir session state stays inside the configured workspace root."
      - "No credentials, cookies, or tokens are written to committed files or logs."
      - "Transcript and audio artifacts are written only to the configured output directory."
    release_blockers:
      - "CLI binary fails to build or the root command does not start."
      - "Authentication flow writes secrets outside the configured session directory."
      - "Scheduler daemon exits non-zero on startup."
  releasability:
    required: true
    status_when_satisfied: "READY_WITH_CONDITIONS"
    required_evidence:
      - kind: "healthy-signal"
        required: true
        description: "go build ./... and go test ./... succeed."
      - kind: "failure-signal"
        required: true
        description: "Non-zero exit from the CLI root command or the scheduler daemon."
      - kind: "monitoring-plan"
        required: true
        description: "Daemon liveness, cron fire success/failure counts, and output-directory disk usage."
      - kind: "rollback-trigger"
        required: true
        description: "Scheduler daemon crash-loops or consecutive cron fires fail to produce a transcript."
      - kind: "rollback-procedure"
        required: true
        description: "Stop the schedule daemon and revert to the previously released binary."
      - kind: "owner"
        required: true
        description: "Operator responsible for the post-deploy observation window."
      - kind: "validation-window"
        required: true
        description: "One full scheduled-meeting cycle after release."
      - kind: "follow-up"
        required: false
        description: "Outstanding manual checkpoints deferred past release."

conventions:
  code_style: {}
  git:
    default_branch: "main"
    remote: "https://github.com/softwaresalt/go-teams.git"
  documentation:
    architecture_doc: "docs/product-specs/Go-TeamsTranscriptCLI-Architecture.md"

