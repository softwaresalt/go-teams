name: Release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test-windows:
    name: Quality Gates (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - name: Install dependencies
        run: go mod download
      - name: Build Windows executable
        run: go build -o bin/go-teams.exe ./cmd/go-teams
      - name: Vet
        run: go vet ./...
      - name: Vet (integration harness)
        run: go vet -tags=integration ./...
      - name: Vet (darwin/amd64 release target)
        env:
          GOOS: darwin
          GOARCH: amd64
        run: go vet ./...
      - name: Lint
        uses: golangci/golangci-lint-action@2226d7cb06a077cd73e56eedd38eecad18e5d837 # v6.5.0
        with:
          version: v1.64.8
          install-mode: goinstall
          args: --timeout=5m
      - name: Verify Windows browser E2E does not skip
        shell: pwsh
        run: |
          $output = go test -v ./internal/browser -run "^TestChromeMeetingEndToEnd$" 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          Write-Host $output
          if ($exitCode -ne 0) {
            Write-Error "TestChromeMeetingEndToEnd failed (exit code $exitCode)"
            exit 1
          }
          if ($output -match '--- SKIP:' -or $output -notmatch '--- PASS: TestChromeMeetingEndToEnd') {
            Write-Error "TestChromeMeetingEndToEnd did not run and pass on windows-latest (skipped or no tests to run); a Chromium-based browser must be resolvable"
            exit 1
          }
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.cliff.outputs.content }}
    steps:
      - name: Checkout (full history for cliff)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@e03236526ace47fa2e04bebcfc6da471ebd4690c # v2.49.0
        with:
          tool: git-cliff

      - name: Generate changelog with git-cliff
        id: cliff
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          BODY="$(git-cliff --latest --strip header 2>/dev/null || true)"
          if [ -z "$BODY" ]; then
            BODY="No changelog entries for this release."
          fi
          {
            printf '%s\n' "content<<CLIFF_EOF"
            printf '%s\n' "$BODY"
            printf '%s\n' "CLIFF_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build release binaries
    needs: [test-windows]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5.4.0
        with:
          go-version-file: go.mod
      - name: Build release executable
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          # Asset names must match updater.AssetName(goos, goarch):
          # go-teams-<goos>-<goarch>, with an .exe suffix only on Windows.
          EXT=""
          if [ "${GOOS}" = "windows" ]; then EXT=".exe"; fi
          VERSION="${GITHUB_REF_NAME#v}"
          COMMIT="${GITHUB_SHA::7}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          go build -ldflags="-s -w \
            -X github.com/softwaresalt/go-teams/internal/version.Version=${VERSION} \
            -X github.com/softwaresalt/go-teams/internal/version.Commit=${COMMIT} \
            -X github.com/softwaresalt/go-teams/internal/version.BuildDate=${BUILD_DATE}" \
            -o "dist/go-teams-${GOOS}-${GOARCH}${EXT}" \
            ./cmd/go-teams
      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: go-teams-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [changelog, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@95815c38cf2ff2164869cbab79da8d1f422bc89e # v4.2.1
        with:
          merge-multiple: true
          path: artifacts/

      - name: Generate SHA256SUMS
        shell: bash
        run: |
          cd artifacts
          find . -maxdepth 1 -type f -name 'go-teams-*' -print0 | sort -z | xargs -0 -r sha256sum > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 3
          # Every supported updater.AssetName(goos, goarch) release asset must be
          # listed, matching the optional "*" and "./" prefixes that
          # updater.parseChecksums strips.
          for expected in \
            go-teams-darwin-amd64 \
            go-teams-windows-amd64.exe \
            go-teams-windows-arm64.exe; do
            pattern="${expected//./\\.}"
            if ! grep -Eq "^[0-9a-f]{64}[[:space:]]+\*?(\./)?${pattern}$" SHA256SUMS; then
              echo "ERROR: SHA256SUMS is missing an entry for ${expected}" >&2
              exit 1
            fi
          done

      - name: Publish release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          body: ${{ needs.changelog.outputs.body }}
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-pre') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
